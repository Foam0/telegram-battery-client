name: Release

on:
  push:
    tags:
      - '[0-9]*'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake golang-go gperf g++ libuv1 libuv1-dev make meson nasm ninja-build yasm

      - name: Install NDK and build-tools
        run: $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;21.4.7075529" "build-tools;35.0.0"

      - name: Create API_KEYS
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
        run: printf 'APP_ID = %s\nAPP_HASH = %s\n' "$APP_ID" "$APP_HASH" > API_KEYS

      - name: Build APKs
        run: |
          ./gradlew assembleAfatRelease assembleAfatDebug \
            assembleAfatFdArm32Release assembleAfatFdArm64Release assembleAfatFdX86Release assembleAfatFdX86_64Release \
            --no-daemon

      - name: Sign APKs
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE }}
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > /tmp/release.jks

          BUILD_TOOLS="${ANDROID_SDK_ROOT}/build-tools/35.0.0"
          APK_DIR=TMessagesProj_App/build/outputs/apk

          sign_apk() {
            "${BUILD_TOOLS}/apksigner" sign \
              --ks /tmp/release.jks \
              --ks-pass "env:KS_PASS" \
              --key-pass "env:KS_PASS" \
              --out "$2" "$1"
          }

          MG_VERSION_CODE=$(grep '^MG_VERSION_CODE=' gradle.properties | cut -d= -f2)
          MG_VERSION_NAME=$(grep '^MG_VERSION_NAME=' gradle.properties | cut -d= -f2)
          VCODE_ARM32=$(( MG_VERSION_CODE * 10 + 7 ))
          VCODE_ARM64=$(( MG_VERSION_CODE * 10 + 8 ))
          VCODE_X86=$(( MG_VERSION_CODE * 10 + 3 ))
          VCODE_X86_64=$(( MG_VERSION_CODE * 10 + 4 ))

          sign_apk "$APK_DIR/afat/release/app.apk"                  "$APK_DIR/afat/release/app-release.apk"
          sign_apk "$APK_DIR/afat/debug/app.apk"                    "$APK_DIR/afat/debug/app-debug.apk"
          sign_apk "$APK_DIR/afatFdArm32/release/afatFdArm32.apk"   "$APK_DIR/Mercurygram-v${MG_VERSION_NAME}-${VCODE_ARM32}.apk"
          sign_apk "$APK_DIR/afatFdArm64/release/afatFdArm64.apk"   "$APK_DIR/Mercurygram-v${MG_VERSION_NAME}-${VCODE_ARM64}.apk"
          sign_apk "$APK_DIR/afatFdX86/release/afatFdX86.apk"       "$APK_DIR/Mercurygram-v${MG_VERSION_NAME}-${VCODE_X86}.apk"
          sign_apk "$APK_DIR/afatFdX86_64/release/afatFdX86_64.apk" "$APK_DIR/Mercurygram-v${MG_VERSION_NAME}-${VCODE_X86_64}.apk"

          echo "MG_VERSION_NAME=${MG_VERSION_NAME}" >> "$GITHUB_ENV"
          echo "VCODE_ARM32=${VCODE_ARM32}" >> "$GITHUB_ENV"
          echo "VCODE_ARM64=${VCODE_ARM64}" >> "$GITHUB_ENV"
          echo "VCODE_X86=${VCODE_X86}" >> "$GITHUB_ENV"
          echo "VCODE_X86_64=${VCODE_X86_64}" >> "$GITHUB_ENV"

          rm /tmp/release.jks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            TMessagesProj_App/build/outputs/apk/afat/debug/app-debug.apk
            TMessagesProj_App/build/outputs/apk/afat/release/app-release.apk
            TMessagesProj_App/build/outputs/apk/Mercurygram-v${{ env.MG_VERSION_NAME }}-${{ env.VCODE_ARM32 }}.apk
            TMessagesProj_App/build/outputs/apk/Mercurygram-v${{ env.MG_VERSION_NAME }}-${{ env.VCODE_ARM64 }}.apk
            TMessagesProj_App/build/outputs/apk/Mercurygram-v${{ env.MG_VERSION_NAME }}-${{ env.VCODE_X86 }}.apk
            TMessagesProj_App/build/outputs/apk/Mercurygram-v${{ env.MG_VERSION_NAME }}-${{ env.VCODE_X86_64 }}.apk
