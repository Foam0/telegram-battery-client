name: Release

on:
  push:
    tags:
      - '[0-9]*'
      # Beta tags are 5-part (X.Y.Z.W.N); stable are 4-part. Exclude betas
      # since '[0-9]*' is a glob (not regex) — '*' matches '.' too.
      - '!*.*.*.*.*'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: afatFdArm32
            task: assembleAfatFdArm32Release
            abi: armeabi-v7a
          - flavor: afatFdArm64
            task: assembleAfatFdArm64Release
            abi: arm64-v8a
          - flavor: afatFdX86
            task: assembleAfatFdX86Release
            abi: x86
          - flavor: afatFdX86_64
            task: assembleAfatFdX86_64Release
            abi: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Read MG_VERSION_NAME
        id: ver
        run: echo "name=$(grep '^MG_VERSION_NAME=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Build APK
        id: build
        uses: ./.github/actions/build-mg
        with:
          flavor: ${{ matrix.flavor }}
          task: ${{ matrix.task }}
          abi: ${{ matrix.abi }}
          build-type: release
          artifact-version: ${{ steps.ver.outputs.name }}
          app-id: ${{ secrets.APP_ID }}
          app-hash: ${{ secrets.APP_HASH }}
          release-keystore-b64: ${{ secrets.RELEASE_KEYSTORE }}
          release-keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          release-key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          release-key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ matrix.abi }}
          path: ${{ steps.build.outputs.apk_path }}

  changelog:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      models: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_TAG=$(git tag -l '[0-9]*' --sort=-version:refname \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -A1 "^${GITHUB_REF_NAME}$" | tail -1)

          if [ "$PREV_TAG" = "$GITHUB_REF_NAME" ] || [ -z "$PREV_TAG" ]; then
            bash .github/scripts/changelog-diff.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/diff.txt"
          else
            bash .github/scripts/changelog-diff.sh "$PREV_TAG" "$GITHUB_REF_NAME" > "$RUNNER_TEMP/diff.txt"
          fi

          jq -n \
            --rawfile sys .github/scripts/changelog-prompt.md \
            --rawfile diff "$RUNNER_TEMP/diff.txt" \
            '{
              model: "openai/gpt-4.1-mini",
              messages: [
                {role: "system", content: $sys},
                {role: "user", content: $diff}
              ]
            }' > "$RUNNER_TEMP/req.json"
          BODY=$(curl -sL -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/req.json" \
            https://models.github.ai/inference/chat/completions \
            | jq -r '.choices[0].message.content // empty')

          if [ -z "$BODY" ]; then
            # Fallback: format current [MG] feature lines as bullets
            BODY=$(grep -A100 '=== CURRENT FEATURES ===' "$RUNNER_TEMP/diff.txt" \
              | grep '^\[MG\]' | sed 's/^\[MG\] /- /' || echo "- See commit history for changes.")
          fi

          echo "$BODY" > "$RUNNER_TEMP/changelog.md"

      - name: Upload changelog artifact
        uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: ${{ runner.temp }}/changelog.md

  reproducibility:
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 360
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download arm64 release APK from build job
        uses: actions/download-artifact@v8
        with:
          name: apk-arm64-v8a
          path: apk-build/

      - name: Verify (fdroid build matches gradle-built arm64 APK)
        run: |
          set -euo pipefail
          apk=$(ls apk-build/*.apk | head -1)
          [ -n "$apk" ] || { echo "no arm64 APK found"; exit 1; }
          scripts/check-reproducibility.sh verify "$apk" "$GITHUB_SHA"

  release:
    runs-on: ubuntu-24.04
    needs: [build, changelog, reproducibility]
    permissions:
      contents: write

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: apk-*
          merge-multiple: true
          path: artifacts/

      - name: Download changelog artifact
        uses: actions/download-artifact@v8
        with:
          name: changelog
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: artifacts/changelog.md
          files: artifacts/*.apk

  fdroiddata-sync:
    runs-on: ubuntu-24.04
    needs: release
    env:
      APPID: it.belloworld.mercurygram
      BRANCH: mercurygram-${{ github.ref_name }}
    concurrency:
      group: fdroiddata-sync-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Download signed APKs
        uses: actions/download-artifact@v8
        with:
          pattern: apk-*
          merge-multiple: true
          path: apks/

      - name: Checkout Mercurygram at tag
        uses: actions/checkout@v6
        with:
          path: mercurygram
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Install fdroidserver + ruamel.yaml
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apksigner
          python3 -m venv "$HOME/fdroid-venv"
          "$HOME/fdroid-venv/bin/pip" install --quiet fdroidserver ruamel.yaml

      - name: Clone fdroiddata
        env:
          GITLAB_TOKEN: ${{ secrets.FDROIDDATA_GITLAB_TOKEN }}
        run: |
          # --filter=blob:none: partial clone, ~50 MB instead of ~500 MB.
          # GitLab refuses push from --depth=1 ("shallow update not allowed")
          # but accepts it from a partial clone.
          git clone --filter=blob:none \
            "https://oauth2:${GITLAB_TOKEN}@gitlab.com/drizzt/fdroiddata.git"
          cd fdroiddata
          git config user.name 'Mercurygram CI'
          git config user.email 'ci@belloworld.it'
          git remote add upstream https://gitlab.com/fdroid/fdroiddata.git
          git fetch --filter=blob:none upstream master
          git checkout -B "$BRANCH" upstream/master

      - name: Sync metadata and extract per-vercode signature blocks
        working-directory: fdroiddata
        run: |
          "$HOME/fdroid-venv/bin/python3" \
            ../mercurygram/.github/scripts/fdroid_sync.py \
            "$GITHUB_REF_NAME" ../apks . ../mercurygram

      - name: Commit and push branch
        working-directory: fdroiddata
        run: |
          git add "metadata/$APPID.yml" "metadata/$APPID/signatures/"
          git commit -m "$APPID: update to ${GITHUB_REF_NAME}"
          git push --force-with-lease -u origin "$BRANCH"

      - name: Open merge request
        env:
          GITLAB_TOKEN: ${{ secrets.FDROIDDATA_GITLAB_TOKEN }}
        run: |
          SRC_PID=$(curl -sf --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            'https://gitlab.com/api/v4/projects/drizzt%2Ffdroiddata' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          curl -sf --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            --data-urlencode "source_branch=$BRANCH" \
            --data-urlencode 'target_branch=master' \
            --data-urlencode "title=$APPID: update to ${GITHUB_REF_NAME}" \
            --data-urlencode 'target_project_id=36528' \
            --data-urlencode 'remove_source_branch=true' \
            "https://gitlab.com/api/v4/projects/${SRC_PID}/merge_requests" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("MR:", d.get("web_url") or d)'
