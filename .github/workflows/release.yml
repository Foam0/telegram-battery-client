name: Release

on:
  push:
    tags:
      - '[0-9]*'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake golang-go gperf g++ libuv1 libuv1-dev make meson nasm ninja-build yasm

      - name: Install NDK and build-tools
        run: $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;21.4.7075529" "build-tools;35.0.0"

      - name: Create API_KEYS
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
        run: printf 'APP_ID = %s\nAPP_HASH = %s\n' "$APP_ID" "$APP_HASH" > API_KEYS

      - name: Build APKs
        run: |
          ./gradlew assembleAfatRelease assembleAfatDebug \
            assembleAfatFdArm32Release assembleAfatFdArm64Release assembleAfatFdX86Release assembleAfatFdX86_64Release \
            --no-daemon

      - name: Sign APKs
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE }}
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > /tmp/release.jks

          BUILD_TOOLS="${ANDROID_SDK_ROOT}/build-tools/35.0.0"
          APK_DIR=TMessagesProj_App/build/outputs/apk

          sign_apk() {
            "${BUILD_TOOLS}/apksigner" sign \
              --ks /tmp/release.jks \
              --ks-pass "env:KS_PASS" \
              --key-pass "env:KS_PASS" \
              --out "$2" "$1"
          }

          sign_apk "$APK_DIR/afat/release/app.apk"                  "$APK_DIR/afat/release/app-release.apk"
          sign_apk "$APK_DIR/afat/debug/app.apk"                    "$APK_DIR/afat/debug/app-debug.apk"
          sign_apk "$APK_DIR/afatFdArm32/release/afatFdArm32.apk"   "$APK_DIR/Mercurygram-armeabi-v7a.apk"
          sign_apk "$APK_DIR/afatFdArm64/release/afatFdArm64.apk"   "$APK_DIR/Mercurygram-arm64-v8a.apk"
          sign_apk "$APK_DIR/afatFdX86/release/afatFdX86.apk"       "$APK_DIR/Mercurygram-x86.apk"
          sign_apk "$APK_DIR/afatFdX86_64/release/afatFdX86_64.apk" "$APK_DIR/Mercurygram-x86_64.apk"

          rm /tmp/release.jks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            TMessagesProj_App/build/outputs/apk/afat/debug/app-debug.apk
            TMessagesProj_App/build/outputs/apk/afat/release/app-release.apk
            TMessagesProj_App/build/outputs/apk/Mercurygram-armeabi-v7a.apk
            TMessagesProj_App/build/outputs/apk/Mercurygram-arm64-v8a.apk
            TMessagesProj_App/build/outputs/apk/Mercurygram-x86.apk
            TMessagesProj_App/build/outputs/apk/Mercurygram-x86_64.apk
