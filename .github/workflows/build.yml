name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: battery-client-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-arm64-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      SING_BOX_VERSION: v1.13.14
      TELEGRAM_APP_ID: ${{ secrets.APP_ID }}
      TELEGRAM_APP_HASH: ${{ secrets.APP_HASH }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.3"
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android and native build tools
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake gperf meson nasm ninja-build pkg-config

      - name: Create Telegram API configuration
        run: |
          app_id="${TELEGRAM_APP_ID:-0}"
          app_hash="${TELEGRAM_APP_HASH:-00000000000000000000000000000000}"
          printf 'APP_ID = %s\nAPP_HASH = %s\n' "$app_id" "$app_hash" > API_KEYS

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/battery-client-ci.keystore"
          if [ -n "${KEYSTORE_B64:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keystore"
            store_password="$STORE_PASSWORD"
            key_alias="$KEY_ALIAS"
            key_password="$KEY_PASSWORD"
          else
            store_password=ci-placeholder-password
            key_alias=ci-placeholder
            key_password=ci-placeholder-password
            keytool -genkeypair -noprompt \
              -keystore "$keystore" \
              -storepass "$store_password" \
              -alias "$key_alias" \
              -keypass "$key_password" \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -dname "CN=CI Placeholder, O=Battery Telegram Client"
          fi
          {
            echo "CI_KEYSTORE=$keystore"
            echo "CI_STORE_PASSWORD=$store_password"
            echo "CI_KEY_ALIAS=$key_alias"
            echo "CI_KEY_PASSWORD=$key_password"
          } >> "$GITHUB_ENV"

      - name: Compute build version
        run: |
          base_version=$(sed -n 's/^APP_VERSION_NAME=//p' gradle.properties)
          test -n "$base_version"
          echo "MG_BUILD_TAG=${base_version}.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build arm64 debug APK
        env:
          NINJA_PATH: ninja
        run: |
          ./gradlew \
            -PMG_BUILD_TAG="$MG_BUILD_TAG" \
            -PRELEASE_STORE_FILE="$CI_KEYSTORE" \
            -PRELEASE_STORE_PASSWORD="$CI_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$CI_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$CI_KEY_PASSWORD" \
            :TMessagesProj_App:assembleAfatFdArm64Debug \
            --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: battery-client-arm64-debug-${{ env.MG_BUILD_TAG }}
          path: TMessagesProj_App/build/outputs/apk/afatFdArm64/debug/afatFdArm64.apk
          if-no-files-found: error
