name: Security checks

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  public-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check public source tree
        run: scripts/check-public-source.sh

      - name: Check sensitive logs
        run: scripts/check-sensitive-logs.sh
