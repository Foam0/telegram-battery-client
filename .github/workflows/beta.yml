name: Beta

on:
  push:
    branches:
      - Mercurygram

concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: afatFdArm32
            task: assembleAfatFdArm32Debug
            abi: armeabi-v7a
          - flavor: afatFdArm64
            task: assembleAfatFdArm64Debug
            abi: arm64-v8a
          - flavor: afatFdX86
            task: assembleAfatFdX86Debug
            abi: x86
          - flavor: afatFdX86_64
            task: assembleAfatFdX86_64Debug
            abi: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Compute beta version
        id: ver
        run: |
          set -euo pipefail
          MG_VN=$(grep '^MG_VERSION_NAME=' gradle.properties | cut -d= -f2)
          echo "name=${MG_VN}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build APK
        id: build
        uses: ./.github/actions/build-mg
        with:
          flavor: ${{ matrix.flavor }}
          task: ${{ matrix.task }}
          abi: ${{ matrix.abi }}
          build-type: debug
          artifact-version: ${{ steps.ver.outputs.name }}
          beta-version-code: ${{ steps.ver.outputs.code }}
          beta-version-name: ${{ steps.ver.outputs.name }}
          app-id: ${{ secrets.APP_ID }}
          app-hash: ${{ secrets.APP_HASH }}
          release-keystore-b64: ${{ secrets.RELEASE_KEYSTORE }}
          release-keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          release-key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          release-key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ matrix.abi }}
          path: ${{ steps.build.outputs.apk_path }}

  release:
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: apk-*
          merge-multiple: true
          path: artifacts/

      - name: Compute beta version and changelog
        id: meta
        run: |
          set -euo pipefail
          MG_VN=$(grep '^MG_VERSION_NAME=' gradle.properties | cut -d= -f2)
          echo "name=${MG_VN}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

          PREV=$(git tag -l "${MG_VN}.*" --sort=-version:refname | head -1 || true)
          {
            if [ -n "$PREV" ]; then
              printf '## Changes since %s\n\n' "$PREV"
              git log --pretty=format:'- %s' "${PREV}..HEAD"
            else
              printf '## Recent changes\n\n'
              git log --pretty=format:'- %s' -n 30
            fi
            printf '\n\ncommit: %s\n' "${GITHUB_SHA}"
          } > "$RUNNER_TEMP/body.md"

      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.name }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: true
          make_latest: false
          body_path: ${{ runner.temp }}/body.md
          files: artifacts/*.apk
