name: Beta

on:
  push:
    branches:
      - Mercurygram

concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # Release builds — reproducible, shares versionCode with the
          # latest stable. Filename has no infix.
          - flavor: afatFdArm32
            task: assembleAfatFdArm32Release
            abi: armeabi-v7a
            build-type: release
            name-infix: ''
          - flavor: afatFdArm64
            task: assembleAfatFdArm64Release
            abi: arm64-v8a
            build-type: release
            name-infix: ''
          - flavor: afatFdX86
            task: assembleAfatFdX86Release
            abi: x86
            build-type: release
            name-infix: ''
          - flavor: afatFdX86_64
            task: assembleAfatFdX86_64Release
            abi: x86_64
            build-type: release
            name-infix: ''
          # Debug builds — `.beta` applicationIdSuffix, side-by-side install
          # with stable. Filename gets a "-debug" infix to distinguish from
          # the Release APK.
          - flavor: afatFdArm32
            task: assembleAfatFdArm32Debug
            abi: armeabi-v7a
            build-type: debug
            name-infix: '-debug'
          - flavor: afatFdArm64
            task: assembleAfatFdArm64Debug
            abi: arm64-v8a
            build-type: debug
            name-infix: '-debug'
          - flavor: afatFdX86
            task: assembleAfatFdX86Debug
            abi: x86
            build-type: debug
            name-infix: '-debug'
          - flavor: afatFdX86_64
            task: assembleAfatFdX86_64Debug
            abi: x86_64
            build-type: debug
            name-infix: '-debug'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Compute beta version
        id: ver
        run: |
          set -euo pipefail
          MG_VN=$(grep '^MG_VERSION_NAME=' gradle.properties | cut -d= -f2)
          echo "name=${MG_VN}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build APK
        id: build
        uses: ./.github/actions/build-mg
        with:
          flavor: ${{ matrix.flavor }}
          task: ${{ matrix.task }}
          abi: ${{ matrix.abi }}
          build-type: ${{ matrix.build-type }}
          artifact-version: ${{ steps.ver.outputs.name }}
          name-infix: ${{ matrix.name-infix }}
          # MG_BETA_* only apply to the debug buildType (see
          # TMessagesProj_App/build.gradle:274). For release, leave the inputs
          # empty so build-mg skips the -P overrides and the variant takes the
          # standard MG_VERSION_CODE*10+abi versionCode.
          beta-version-code: ${{ matrix.build-type == 'debug' && steps.ver.outputs.code || '' }}
          beta-version-name: ${{ matrix.build-type == 'debug' && steps.ver.outputs.name || '' }}
          app-id: ${{ secrets.APP_ID }}
          app-hash: ${{ secrets.APP_HASH }}
          release-keystore-b64: ${{ secrets.RELEASE_KEYSTORE }}
          release-keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          release-key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          release-key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ matrix.abi }}-${{ matrix.build-type }}
          path: ${{ steps.build.outputs.apk_path }}

  release:
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.meta.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: apk-*
          merge-multiple: true
          path: artifacts/

      - name: Compute beta version and changelog
        id: meta
        run: |
          set -euo pipefail
          MG_VN=$(grep '^MG_VERSION_NAME=' gradle.properties | cut -d= -f2)
          echo "name=${MG_VN}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

          PREV=$(git tag -l "${MG_VN}.*" --sort=-version:refname | head -1 || true)
          {
            if [ -n "$PREV" ]; then
              printf '## Changes since %s\n\n' "$PREV"
              git log --pretty=format:'- %s' "${PREV}..HEAD"
            else
              printf '## Recent changes\n\n'
              git log --pretty=format:'- %s' -n 30
            fi
            printf '\n\ncommit: %s\n' "${GITHUB_SHA}"
          } > "$RUNNER_TEMP/body.md"

      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.name }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: true
          make_latest: false
          body_path: ${{ runner.temp }}/body.md
          files: artifacts/*.apk

  # Reproducibility regression guard for the beta channel: rebuild the just-
  # published arm64 Release APK inside the F-Droid buildserver-trixie env and
  # compare against the GitHub artifact. arm64 only — the source is identical
  # across ABIs; per-ABI delta is the buildNativeLibs<Abi> task. continue-on-
  # error is on so an infra hiccup or a transient diffoscope mismatch never
  # blocks a beta release. Flip to hard-fail once the run is consistently green.
  verify:
    runs-on: ubuntu-24.04
    needs: release
    timeout-minutes: 90
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Run reproducibility check (arm64 Release APK)
        env:
          TAG: ${{ needs.release.outputs.tag }}
          REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          url="https://github.com/${{ github.repository }}/releases/download/${TAG}/Mercurygram-${TAG}-arm64-v8a.apk"
          scripts/check-reproducibility.sh verify "$url" "$REF"
