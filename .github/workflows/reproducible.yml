name: Reproducible build check

# Heavy (full native + 2x fdroidserver build) — manual trigger only, not on
# every push. Run before tagging a release, or after touching build.gradle,
# native code, or bundled assets. Mirrors F-Droid's real reproducible-build
# verification (scripts/check-reproducibility.sh).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'determinism (build ref twice) | verify (vs f-droid.org) | verify-beta (vs GitHub release APK)'
        type: choice
        options: [determinism, verify, verify-beta]
        default: determinism
      arg:
        description: 'determinism: git ref (blank=checked-out) — verify: versionCode — verify-beta: GitHub APK URL'
        type: string
        default: ''
      arg2:
        description: 'verify-beta only: optional git ref (defaults to checked-out commit)'
        type: string
        default: ''

concurrency:
  group: reproducible-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproducible:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Run reproducibility check (real fdroidserver, podman)
        run: |
          set -euo pipefail
          case "${{ inputs.mode }}" in
            verify)      scripts/check-reproducibility.sh verify "${{ inputs.arg }}" ;;
            verify-beta) scripts/check-reproducibility.sh verify-beta "${{ inputs.arg }}" "${{ inputs.arg2 }}" ;;
            *)           scripts/check-reproducibility.sh determinism "${{ inputs.arg }}" ;;
          esac
