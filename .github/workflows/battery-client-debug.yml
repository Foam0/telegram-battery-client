name: Battery client debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - codex/battery-client

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      MG_BUILD_TAG: 12.8.1.2.5
      SING_BOX_VERSION: v1.13.14
      TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
      TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.3"
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build meson gperf pkg-config

      - name: Create API key file
        run: |
          APP_ID_VALUE="${TELEGRAM_APP_ID:-0}"
          APP_HASH_VALUE="${TELEGRAM_APP_HASH:-00000000000000000000000000000000}"
          {
            echo "APP_ID = ${APP_ID_VALUE}"
            echo "APP_HASH = ${APP_HASH_VALUE}"
          } > API_KEYS

      - name: Build arm64 debug APK
        env:
          NINJA_PATH: ninja
        run: ./gradlew -PMG_BUILD_TAG="${MG_BUILD_TAG}" :TMessagesProj_App:assembleAfatFdArm64Debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: battery-client-afatFdArm64-debug
          path: TMessagesProj_App/build/outputs/apk/afatFdArm64/debug/afatFdArm64.apk
