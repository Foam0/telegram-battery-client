name: Build Mercurygram APK
description: >-
  Composite action that prepares the JDK + NDK + build-tools, writes API_KEYS
  and the signing keystore, runs a single gradle assemble task, and renames the
  output APK. Shared by release.yml, beta.yml, and prerelease.yml so all three
  pipelines produce byte-identical artifacts.

inputs:
  flavor:
    description: 'Gradle product flavor (e.g. afatFdArm64).'
    required: true
  task:
    description: 'Gradle task to run (e.g. assembleAfatFdArm64Release).'
    required: true
  abi:
    description: 'ABI suffix for the output APK name (e.g. arm64-v8a).'
    required: true
  build-type:
    description: 'release or debug — selects the output directory.'
    required: true
  artifact-version:
    description: 'Version string for the renamed APK filename (Mercurygram-<ver>-<abi>.apk).'
    required: true
  name-infix:
    description: 'Optional infix between "Mercurygram-" and the version (e.g. "-debug" for the beta debug variant). Empty by default.'
    required: false
    default: ''
  beta-version-code:
    description: 'Optional MG_BETA_VERSION_CODE override (beta workflow only).'
    required: false
    default: ''
  beta-version-name:
    description: 'Optional MG_BETA_VERSION_NAME override (beta workflow only).'
    required: false
    default: ''
  app-id:
    description: 'Telegram APP_ID (from secrets).'
    required: true
  app-hash:
    description: 'Telegram APP_HASH (from secrets).'
    required: true
  release-keystore-b64:
    description: 'Base64-encoded release keystore (from secrets).'
    required: true
  release-keystore-password:
    description: 'Keystore password (from secrets).'
    required: true
  release-key-alias:
    description: 'Key alias (from secrets).'
    required: true
  release-key-password:
    description: 'Key password (from secrets).'
    required: true

outputs:
  apk_path:
    description: 'Path to the renamed signed APK.'
    value: ${{ steps.rename.outputs.apk_path }}

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Install host build tools
      shell: bash
      run: |
        # ubuntu-24.04 preinstalls cmake, g++, make, ninja-build, golang-go.
        # nasm is needed by dav1d's x86/x86_64 SIMD assembly (meson errors out
        # otherwise — ARM builds don't hit this path).
        sudo apt-get install -y --no-install-recommends gperf meson libuv1 libuv1-dev nasm

    - name: Cache Android NDK and build-tools
      uses: actions/cache@v5
      with:
        path: |
          ${{ env.ANDROID_SDK_ROOT }}/ndk/21.4.7075529
          ${{ env.ANDROID_SDK_ROOT }}/build-tools/35.0.0
        key: android-sdk-${{ runner.os }}-ndk-21.4.7075529-buildtools-35.0.0

    - name: Install NDK and build-tools
      shell: bash
      run: $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;21.4.7075529" "build-tools;35.0.0"

    - name: Create API_KEYS
      shell: bash
      env:
        APP_ID: ${{ inputs.app-id }}
        APP_HASH: ${{ inputs.app-hash }}
      run: printf 'APP_ID = %s\nAPP_HASH = %s\n' "$APP_ID" "$APP_HASH" > API_KEYS

    - name: Setup signing
      shell: bash
      env:
        KEYSTORE_B64: ${{ inputs.release-keystore-b64 }}
      run: echo "$KEYSTORE_B64" | base64 -d > TMessagesProj/config/release.keystore

    - name: Build APK
      shell: bash
      env:
        KS_PASS: ${{ inputs.release-keystore-password }}
        KS_KEY_ALIAS: ${{ inputs.release-key-alias }}
        KS_KEY_PASS: ${{ inputs.release-key-password }}
        BETA_VC: ${{ inputs.beta-version-code }}
        BETA_VN: ${{ inputs.beta-version-name }}
      run: |
        set -euo pipefail
        EXTRA=()
        if [ -n "$BETA_VC" ]; then
            EXTRA+=("-PMG_BETA_VERSION_CODE=$BETA_VC")
        fi
        if [ -n "$BETA_VN" ]; then
            EXTRA+=("-PMG_BETA_VERSION_NAME=$BETA_VN")
        fi
        ./gradlew "${{ inputs.task }}" \
            -PRELEASE_STORE_PASSWORD="$KS_PASS" \
            -PRELEASE_KEY_PASSWORD="$KS_KEY_PASS" \
            -PRELEASE_KEY_ALIAS="$KS_KEY_ALIAS" \
            "${EXTRA[@]}" \
            --no-daemon

    - name: Rename artifact
      id: rename
      shell: bash
      run: |
        set -euo pipefail
        APK_DIR=TMessagesProj_App/build/outputs/apk/${{ inputs.flavor }}/${{ inputs.build-type }}
        DEST="$APK_DIR/Mercurygram${{ inputs.name-infix }}-${{ inputs.artifact-version }}-${{ inputs.abi }}.apk"
        cp "$APK_DIR/${{ inputs.flavor }}.apk" "$DEST"
        echo "apk_path=${DEST}" >> "$GITHUB_OUTPUT"
